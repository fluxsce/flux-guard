name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[release notes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: fluxsce/dbx
          path: .ci/dbx
          ref: main
      - uses: actions/checkout@v5
        with:
          repository: Blair-Shang/niuma-ui
          path: .ci/niuma-ui
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use checked-out dbx
        run: go mod edit -replace github.com/fluxsce/dbx=./.ci/dbx
      - name: Test
        run: go test -count=1 ./...
      - name: Publish changelog version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git log -1 --format=%s | grep -F '[release notes]' >/dev/null; then
            echo "release-notes commit; skip"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          PUBLISHED=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | paste -sd, -)
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          VERSION=$(python3 .github/scripts/cut_changelog.py plan --version "${VERSION}" --published "${PUBLISHED}" --date "${DATE}" --notes release-notes.md)
          if [[ -z "${VERSION}" ]]; then
            echo "no unpublished changelog notes; skip"
            exit 0
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already published"
            exit 0
          fi
          ln -sfn "$GITHUB_WORKSPACE/.ci/niuma-ui" "$GITHUB_WORKSPACE/../niuma-ui"
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --dir "$GITHUB_WORKSPACE/../niuma-ui"
          pnpm install --dir web --frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=4096 pnpm --dir web exec vite build
          test -f web/dist/index.html
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=$(git rev-parse --short=12 HEAD)
          LDFLAGS="-s -w -X fluxguard/common/buildinfo.Version=${VERSION} -X fluxguard/common/buildinfo.Commit=${SHA} -X fluxguard/common/buildinfo.Date=${STAMP}"
          mkdir -p dist
          rm -rf agents/java/build
          mkdir -p agents/java/build
          list="$(mktemp)"
          find agents/java/src -name '*.java' > "${list}"
          javac --release 8 -encoding UTF-8 -d agents/java/build @"${list}"
          rm -f "${list}"
          jar cfm dist/flux-guard-agent-java.jar agents/java/MANIFEST.MF -C agents/java/build .
          jar tf dist/flux-guard-agent-java.jar | grep -qx 'fluxguard/agent/Agent.class'
          unzip -p dist/flux-guard-agent-java.jar META-INF/MANIFEST.MF | grep -q 'Premain-Class: fluxguard.agent.Agent'
          while read -r goos goarch; do
            ext=""
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
            fi
            dir="dist/flux-guard"
            rm -rf "${dir}"
            mkdir -p "${dir}"
            stage="$(mktemp -d)"
            mkdir -p "${dir}/configs" "${dir}/agents" \
              "${stage}/host/configs" "${stage}/app/configs" "${stage}/java/configs"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${dir}/flux-guard-server${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/host/flux-guard-agent-host${ext}" ./cmd/host
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/app/flux-guard-agent-app${ext}" ./cmd/app
            mkdir -p "${dir}/web"
            cp -a web/dist "${dir}/web/dist"
            cp -a configs/server.yaml.example "${dir}/configs/"
            cp -a configs/host.yaml.example "${stage}/host/configs/"
            cp -a configs/app.yaml.example "${stage}/app/configs/"
            cp -a configs/java.yaml.example "${stage}/java/configs/"
            cp -a dist/flux-guard-agent-java.jar "${stage}/java/flux-guard-agent-java.jar"
            cp -a scripts "${dir}/"
            mkdir -p "${stage}/host/scripts" "${stage}/app/scripts"
            cp -a scripts/run "${stage}/host/scripts/run"
            cp -a scripts/run "${stage}/app/scripts/run"
            find "${dir}" "${stage}" -type f -name '*.sh' -exec chmod 755 {} +
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-host.tar.gz" --transform 's,^host,flux-guard-agent-host,' host
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-app.tar.gz" --transform 's,^app,flux-guard-agent-app,' app
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-java.tar.gz" --transform 's,^java,flux-guard-agent-java,' java
            rm -rf "${stage}"
            tar -C dist -czf "dist/flux-guard-${VERSION}-${goos}-${goarch}.tar.gz" flux-guard
            rm -rf "${dir}"
          done <<'EOF'
          linux amd64
          linux arm64
          windows amd64
          darwin amd64
          darwin arm64
          EOF
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          python3 .github/scripts/cut_changelog.py apply --version "${VERSION}" --date "${DATE}" --notes release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changelog already records v${VERSION}"
          else
            git commit -m "docs: 记录 v${VERSION} 版本说明 [release notes]"
            git push origin HEAD:master
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md dist/*.tar.gz dist/SHA256SUMS.txt
