<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 860" role="img">
  <title>Flux Guard 分层架构</title>
  <desc>逻辑分层。使用层调用控制层，控制层写入数据层。采集层位于最下方，向控制层上报，并接收命令与终端会话。</desc>
  <defs>
    <marker id="ly-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="ly-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1360" height="860" fill="#ffffff"/>

  <rect x="40" y="24" width="1180" height="132" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="24" width="108" height="132" fill="#334155"/>
  <text x="94" y="84" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">使用层</text>
  <text x="94" y="108" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">01</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
