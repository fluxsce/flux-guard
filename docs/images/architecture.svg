  <text x="94" y="270" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">控制层</text>
  <text x="94" y="294" text-anchor="middle" fill="#bfdbfe" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">02</text>
