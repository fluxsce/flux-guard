# 中央服务器。环境变量前缀 FLUX_GUARD，例如 FLUX_GUARD_LISTEN 覆盖 listen，FLUX_GUARD_DB_HOST 覆盖 db.host。
listen: ":8080" # 本程序监听的地址。:8080 表示本机 8080 端口
tenant_id: default # 本服务器所属租户。登录没有会话租户时用它，须与脚本种子里的 tenantId 一致

# HTTPS。启用后须提供 PEM 证书与私钥；会话 Cookie 默认随之带 Secure。
enable_https: false
cert_file: "" # 例如 certs/server.crt
key_file: "" # 例如 certs/server.key
key_password: "" # 预留。当前须使用未加密 PEM；加密私钥请先 openssl 解密
# cookie_secure: true # 可选。不写则跟随 enable_https；显式 true/false 可覆盖（反代终止 TLS 时常用 true）

# 数据库。两种写法：
# 1. 填写 dsn，原样作为连接串。sqlite 写文件路径，mysql 写完整连接串。
# 2. dsn 留空，再填下面的主机、端口、账号、口令和库名。这和 gateway 的 connection 是同一组字段。
db:
  driver: sqlite # sqlite：一个文件，不用另装数据库。mysql：连接一台 MySQL
  dsn: data/flux_guard.db # 有内容时优先使用。改用主机配置时把这一行留空
  host: "" # 数据库所在机器，例如 127.0.0.1。只在 dsn 为空且 driver 为 mysql 时使用
  port: 3306 # 端口。MySQL 默认 3306
  username: "" # 登录账号
  password: "" # 登录口令
  database: "" # MySQL 的库名。sqlite 且 dsn 为空时，这里写文件路径

# 日志。写到文件里，关掉窗口还能查。单个文件到大小就换新的，旧文件只留有限份和天数。
log:
  file: logs/server.log # 日志文件。留空则只显示在窗口里
  level: info # 最低级别：debug、info、warn、error。低于此级别的不写
  max_size_mb: 20 # 单个文件超过这么多 MB 就换新文件
  max_backups: 5 # 最多保留几个旧文件
  max_age_days: 14 # 旧文件超过这么多天就删除
  console: true # 是否同时显示在窗口里
