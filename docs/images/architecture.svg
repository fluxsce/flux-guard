    <text x="434" y="294" text-anchor="middle" fill="#64748b" font-size="12">登录 · 按钮</text>
    <rect x="532" y="236" width="164" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="614" y="272" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">观测查询</text>
    <text x="614" y="294" text-anchor="middle" fill="#64748b" font-size="12">当前值 · 曲线</text>
    <rect x="712" y="236" width="164" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="794" y="272" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">远程操作</text>
    <text x="794" y="294" text-anchor="middle" fill="#64748b" font-size="12">命令 · 终端</text>
    <rect x="892" y="236" width="164" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="974" y="272" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">预警</text>
    <text x="974" y="294" text-anchor="middle" fill="#64748b" font-size="12">规则 · 事件</text>
    <rect x="1072" y="236" width="124" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1134" y="272" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">任务</text>
    <text x="1134" y="294" text-anchor="middle" fill="#64748b" font-size="12">调度 · 归档</text>
  </g>

  <line x1="630" y1="356" x2="630" y2="396" stroke="#334155" stroke-width="1.5" marker-end="url(#ly-a)"/>
  <text x="642" y="382" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600">③ 写入与读取</text>

  <rect x="40" y="400" width="1180" height="132" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="400" width="108" height="132" fill="#5b21b6"/>
  <text x="94" y="460" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">数据层</text>
  <text x="94" y="484" text-anchor="middle" fill="#ddd6fe" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">03</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="172" y="428" width="240" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="292" y="460" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">账号与权限</text>
    <text x="292" y="482" text-anchor="middle" fill="#64748b" font-size="12">用户 · 角色 · 资源</text>
    <rect x="428" y="428" width="280" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="568" y="460" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">主机与 Java 指标</text>
    <text x="568" y="482" text-anchor="middle" fill="#64748b" font-size="12">当前值与历史曲线</text>
    <rect x="724" y="428" width="240" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="844" y="460" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">预警与任务</text>
    <text x="844" y="482" text-anchor="middle" fill="#64748b" font-size="12">事件 · 投递 · 调度</text>
    <rect x="980" y="428" width="216" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1088" y="460" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">审计</text>
    <text x="1088" y="482" text-anchor="middle" fill="#64748b" font-size="12">管理操作 · 代理回执</text>
  </g>

  <rect x="40" y="572" width="1180" height="140" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="40" y="572" width="108" height="140" fill="#0f766e"/>
  <text x="94" y="634" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">采集层</text>
  <text x="94" y="658" text-anchor="middle" fill="#99f6e4" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">04</text>
  <g font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <rect x="172" y="604" width="320" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="332" y="638" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">主机代理</text>
    <text x="332" y="662" text-anchor="middle" fill="#64748b" font-size="12">CPU · 内存 · 磁盘 · 网卡 · 进程</text>
    <rect x="508" y="604" width="320" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="668" y="638" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">应用代理</text>
    <text x="668" y="662" text-anchor="middle" fill="#64748b" font-size="12">进程自身的运行状况</text>
    <rect x="844" y="604" width="320" height="84" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1004" y="638" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">Java 代理</text>
    <text x="1004" y="662" text-anchor="middle" fill="#64748b" font-size="12">堆 · 垃圾回收 · 线程</text>
  </g>

  <path d="M1220 642 H1288 V278 H1220" fill="none" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#ly-b)"/>
  <text x="1300" y="470" fill="#1d4ed8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12" font-weight="600" transform="rotate(90 1300 470)">④ 指标上报　⑤ 命令下发　⑥ 终端回连</text>
</svg>