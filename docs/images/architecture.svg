    <text x="270" y="84" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">运行观测</text>
    <text x="270" y="106" text-anchor="middle" fill="#64748b" font-size="12">总览 · 主机 · Java</text>
    <rect x="384" y="52" width="196" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="482" y="84" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">预警处置</text>
    <text x="482" y="106" text-anchor="middle" fill="#64748b" font-size="12">事件 · 确认 · 恢复</text>
    <rect x="596" y="52" width="196" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="694" y="84" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">权限与任务</text>
    <text x="694" y="106" text-anchor="middle" fill="#64748b" font-size="12">用户 · 角色 · 调度</text>
    <rect x="808" y="52" width="196" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="906" y="84" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">远程操作</text>
    <text x="906" y="106" text-anchor="middle" fill="#64748b" font-size="12">命令 · 交互终端</text>
    <rect x="1020" y="52" width="176" height="76" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
    <text x="1108" y="84" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="600">审计</text>
    <text x="1108" y="106" text-anchor="middle" fill="#64748b" font-size="12">操作记录</text>
  </g>

  <line x1="630" y1="156" x2="630" y2="196" stroke="#334155" stroke-width="1.5" marker-end="url(#ly-a)"/>
