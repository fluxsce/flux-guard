id: com.fluxguard.zk
name: ZooKeeper
version: 1.0.0
bridge:
  namespace: zk
  connection_kind: zk
session:
  inject_credentials: true
  credential_methods:
    - probe
    - children
    - stat
    - get
    - create
    - set
    - delete
    - acl
    - setacl
    - move
runtime:
  executable: zk/dist/zk-probe/zk-probe.exe
  executable_windows: zk/dist/zk-probe/zk-probe.exe
  executable_unix: zk/dist/zk-probe/zk-probe
  lang: java
ipc:
  transport: named_pipe
  transport_windows: named_pipe
  transport_unix: unix_socket
  address: '\\.\pipe\fluxguard.zk'
  address_windows: '\\.\pipe\fluxguard.zk'
  address_unix: zk/dist/zk-probe/zk.sock
  protocol: length_prefixed_json
lifecycle:
  startup: lazy
permissions: []
methods:
  - name: probe
  - name: children
    args: [path]
  - name: stat
    args: [path]
  - name: get
    args: [path]
  - name: create
    args: [path, data, mode]
  - name: set
    args: [path, data, version]
  - name: delete
    args: [path, version, recursive]
  - name: acl
    args: [path]
  - name: setacl
    args: [path, acl, version]
  - name: move
    args: [path, dest]
