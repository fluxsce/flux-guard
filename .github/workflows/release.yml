name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  actions: write

  
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  clean-storage:
    if: ${{ !contains(github.event.head_commit.message, '[release notes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Free Actions storage and open plugin handoff
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash .github/scripts/free_actions_storage.sh

  kafka-plugin:
    needs: clean-storage
    if: ${{ !contains(github.event.head_commit.message, '[release notes]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Maven
        shell: bash
        run: |
          set -euo pipefail
          ver=3.9.15
          dest="${RUNNER_TEMP}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # RUNNER_TEMP is D:\...; Git Bash tar treats "D:" as a remote host.
            dest="$(cygpath -u "${RUNNER_TEMP}")"
          fi
          curl -fsSL -o "${dest}/maven.tgz" "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/${ver}/apache-maven-${ver}-bin.tar.gz"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            tar --force-local -xzf "${dest}/maven.tgz" -C "${dest}"
          else
            tar -xzf "${dest}/maven.tgz" -C "${dest}"
          fi
          bin="${dest}/apache-maven-${ver}/bin"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            bin=$(cd "${bin}" && pwd -W)
          fi
          echo "${bin}" >> "${GITHUB_PATH}"
      - name: Build Kafka plugin
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File plugins/kafka/build.ps1
            test -f plugins/kafka/dist/kafka-probe/kafka-probe.exe
          else
            bash plugins/kafka/build.sh
            test -x plugins/kafka/dist/kafka-probe/kafka-probe
          fi
          test -f plugins/manifests/kafka.yaml
          if [ "${{ matrix.goos }}" = "windows" ]; then
            powershell -NoProfile -ExecutionPolicy Bypass -File plugins/zk/build.ps1
            test -f plugins/zk/dist/zk-probe/zk-probe.exe
          else
            bash plugins/zk/build.sh
            test -x plugins/zk/dist/zk-probe/zk-probe
          fi
          test -f plugins/manifests/zk.yaml
      - name: Stage plugin image
        shell: bash
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/plugin-stage"
          mkdir -p "${stage}/kafka/dist" "${stage}/zk/dist" "${stage}/manifests"
          cp -a plugins/kafka/dist/kafka-probe "${stage}/kafka/dist/"
          cp -a plugins/zk/dist/zk-probe "${stage}/zk/dist/"
          cp -a plugins/manifests/kafka.yaml "${stage}/manifests/"
          cp -a plugins/manifests/zk.yaml "${stage}/manifests/"
      - name: Upload plugin image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          name="kafka-probe-${{ matrix.goos }}-${{ matrix.goarch }}"
          stage="${RUNNER_TEMP}/plugin-stage"
          archive="${RUNNER_TEMP}/${name}.tar.gz"
          upload_path="${archive}"
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # RUNNER_TEMP is D:\...; Git Bash tar treats "D:" as a remote host.
            unix_temp="$(cygpath -u "${RUNNER_TEMP}")"
            stage="${unix_temp}/plugin-stage"
            archive="${unix_temp}/${name}.tar.gz"
            upload_path="$(cygpath -w "${archive}")"
          fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            test -f "${stage}/kafka/dist/kafka-probe/kafka-probe.exe"
            test -f "${stage}/zk/dist/zk-probe/zk-probe.exe"
          else
            test -f "${stage}/kafka/dist/kafka-probe/kafka-probe"
            test -f "${stage}/zk/dist/zk-probe/zk-probe"
          fi
          test -f "${stage}/manifests/kafka.yaml"
          test -f "${stage}/manifests/zk.yaml"
          tar -C "${stage}" -czf "${archive}" .
          test -s "${archive}"
          uploaded=0
          for attempt in 1 2 3 4 5 6; do
            if gh release upload "build-${GITHUB_RUN_ID}" "${upload_path}" --clobber; then
              uploaded=1
              break
            fi
            echo "upload attempt ${attempt} failed; retrying"
            sleep $((attempt * 3 + RANDOM % 3))
          done
          test "${uploaded}" = "1"

  publish:
    needs: kafka-plugin
    if: ${{ !contains(github.event.head_commit.message, '[release notes]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: fluxsce/dbx
          path: .ci/dbx
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Use checked-out dbx
        run: go mod edit -replace github.com/fluxsce/dbx=./.ci/dbx
      - name: Download plugin images
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          dest=".ci/plugin-archives"
          rm -rf "${dest}" .ci/plugins
          mkdir -p "${dest}"
          gh release download "build-${GITHUB_RUN_ID}" --dir "${dest}" --pattern "kafka-probe-*.tar.gz"
          found=0
          for archive in "${dest}"/kafka-probe-*.tar.gz; do
            [ -f "${archive}" ] || continue
            found=1
            name=$(basename "${archive}" .tar.gz)
            mkdir -p ".ci/plugins/${name}"
            tar -xzf "${archive}" -C ".ci/plugins/${name}"
          done
          test "${found}" = "1"
          test -d .ci/plugins/kafka-probe-linux-amd64/kafka/dist/kafka-probe
          test -d .ci/plugins/kafka-probe-windows-amd64/kafka/dist/kafka-probe
          test -d .ci/plugins/kafka-probe-darwin-arm64/kafka/dist/kafka-probe
          test -f .ci/plugins/kafka-probe-linux-amd64/manifests/kafka.yaml
          test -f .ci/plugins/kafka-probe-linux-amd64/manifests/zk.yaml
      - name: Test
        run: go test -count=1 ./...
      - name: Publish changelog version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git log -1 --format=%s | grep -F '[release notes]' >/dev/null; then
            echo "release-notes commit; skip"
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          PUBLISHED=$(git tag -l 'v[0-9]*' | sed -nE 's/^v([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' | paste -sd, -)
          VERSION=$(python3 -c 'import json; print(json.load(open("package.json", encoding="utf-8"))["version"])')
          VERSION=$(python3 .github/scripts/cut_changelog.py plan --version "${VERSION}" --published "${PUBLISHED}" --date "${DATE}" --notes release-notes.md)
          if [[ -z "${VERSION}" ]]; then
            echo "no unpublished changelog notes; skip"
            exit 0
          fi
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} already published"
            exit 0
          fi
          corepack enable
          corepack prepare pnpm@9.15.9 --activate
          pnpm install --dir web --frozen-lockfile
          NODE_OPTIONS=--max-old-space-size=4096 pnpm --dir web exec vite build
          test -f web/dist/index.html
          STAMP=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA=$(git rev-parse --short=12 HEAD)
          LDFLAGS="-s -w -X fluxguard/common/buildinfo.Version=${VERSION} -X fluxguard/common/buildinfo.Commit=${SHA} -X fluxguard/common/buildinfo.Date=${STAMP}"
          mkdir -p dist
          rm -rf agents/java/build
          mkdir -p agents/java/build
          list="$(mktemp)"
          find agents/java/src -name '*.java' > "${list}"
          javac --release 8 -encoding UTF-8 -d agents/java/build @"${list}"
          rm -f "${list}"
          jar cfm dist/flux-guard-agent-java.jar agents/java/MANIFEST.MF -C agents/java/build .
          jar tf dist/flux-guard-agent-java.jar | grep -qx 'fluxguard/agent/Agent.class'
          unzip -p dist/flux-guard-agent-java.jar META-INF/MANIFEST.MF | grep -q 'Premain-Class: fluxguard.agent.Agent'
          while read -r goos goarch; do
            ext=""
            if [[ "${goos}" == "windows" ]]; then
              ext=".exe"
            fi
            dir="dist/flux-guard"
            rm -rf "${dir}"
            mkdir -p "${dir}"
            stage="$(mktemp -d)"
            mkdir -p "${dir}/configs" "${dir}/agents" \
              "${stage}/host/configs" "${stage}/goruntime/configs" "${stage}/appside/configs" "${stage}/java/configs"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${dir}/flux-guard-server${ext}" ./cmd/server
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/host/flux-guard-agent-host${ext}" ./cmd/host
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/goruntime/flux-guard-agent-goruntime${ext}" ./cmd/goruntime
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" go build -trimpath -ldflags "${LDFLAGS}" -o "${stage}/appside/flux-guard-agent-appside${ext}" ./cmd/appside
            mkdir -p "${dir}/web"
            cp -a web/dist "${dir}/web/dist"
            cp -a configs/server.yaml.example "${dir}/configs/"
            cp -a configs/host.yaml.example "${stage}/host/configs/"
            cp -a configs/goruntime.yaml.example "${stage}/goruntime/configs/"
            cp -a configs/appside.yaml.example "${stage}/appside/configs/"
            cp -a configs/java.yaml.example "${stage}/java/configs/"
            cp -a dist/flux-guard-agent-java.jar "${stage}/java/flux-guard-agent-java.jar"
            cp -a scripts "${dir}/"
            plugin_src=".ci/plugins/kafka-probe-${goos}-${goarch}"
            case "${goos}-${goarch}" in
              linux-amd64|windows-amd64|darwin-arm64)
                test -d "${plugin_src}/kafka/dist/kafka-probe"
                test -d "${plugin_src}/zk/dist/zk-probe"
                test -f "${plugin_src}/manifests/kafka.yaml"
                test -f "${plugin_src}/manifests/zk.yaml"
                mkdir -p "${dir}/plugins"
                cp -a "${plugin_src}/kafka" "${dir}/plugins/"
                cp -a "${plugin_src}/zk" "${dir}/plugins/"
                mkdir -p "${dir}/plugins/manifests"
                cp -a "${plugin_src}/manifests/kafka.yaml" "${dir}/plugins/manifests/"
                cp -a "${plugin_src}/manifests/zk.yaml" "${dir}/plugins/manifests/"
                if [[ "${goos}" == "windows" ]]; then
                  test -f "${dir}/plugins/kafka/dist/kafka-probe/kafka-probe.exe"
                  test -f "${dir}/plugins/zk/dist/zk-probe/zk-probe.exe"
                else
                  test -f "${dir}/plugins/kafka/dist/kafka-probe/kafka-probe"
                  test -f "${dir}/plugins/zk/dist/zk-probe/zk-probe"
                  find "${dir}/plugins/kafka/dist/kafka-probe" "${dir}/plugins/zk/dist/zk-probe" -type f \( -name kafka-probe -o -name zk-probe -o -name java \) -exec chmod 755 {} +
                fi
                ;;
            esac
            mkdir -p "${stage}/host/scripts" "${stage}/goruntime/scripts" "${stage}/appside/scripts"
            cp -a scripts/run "${stage}/host/scripts/run"
            cp -a scripts/run "${stage}/goruntime/scripts/run"
            cp -a scripts/run "${stage}/appside/scripts/run"
            find "${dir}" "${stage}" -type f -name '*.sh' -exec chmod 755 {} +
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-host.tar.gz" --transform 's,^host,flux-guard-agent-host,' host
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-goruntime.tar.gz" --transform 's,^goruntime,flux-guard-agent-goruntime,' goruntime
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-appside.tar.gz" --transform 's,^appside,flux-guard-agent-appside,' appside
            tar -C "${stage}" -czf "${dir}/agents/flux-guard-agent-java.tar.gz" --transform 's,^java,flux-guard-agent-java,' java
            rm -rf "${stage}"
            tar -C dist -czf "dist/flux-guard-${VERSION}-${goos}-${goarch}.tar.gz" flux-guard
            rm -rf "${dir}"
          done <<'EOF'
          linux amd64
          linux arm64
          windows amd64
          darwin amd64
          darwin arm64
          EOF
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          # apply 仅在 Unreleased→版本节有实质迁移或补日期时改写 CHANGELOG，
          # 避免只删空行也 push [release notes]，与本地开发提交抢 master。
          python3 .github/scripts/cut_changelog.py apply --version "${VERSION}" --date "${DATE}" --notes release-notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          if git diff --cached --quiet; then
            echo "changelog already records v${VERSION}"
          else
            git commit -m "docs: 记录 v${VERSION} 版本说明 [release notes]"
            git push origin HEAD:master
          fi
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "v${VERSION}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes-file release-notes.md dist/*.tar.gz dist/SHA256SUMS.txt
      - name: Delete plugin handoff release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete "build-${GITHUB_RUN_ID}" --yes --cleanup-tag
