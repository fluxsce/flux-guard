<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
  <title>Flux Guard 系统架构</title>
  <desc>部署视图。运维人员经浏览器访问中央节点上的控制台与中央服务。中央服务读写同节点上的数据库，向外部通知系统投递预警，并与各台被监控主机上的代理通信。</desc>
  <defs>
    <marker id="sys-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#334155"/>
    </marker>
    <marker id="sys-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1d4ed8"/>
    </marker>
  </defs>
  <rect width="1200" height="700" fill="#ffffff"/>

  <circle cx="78" cy="118" r="16" fill="none" stroke="#334155" stroke-width="1.75"/>
  <path d="M48 176 C48 146 108 146 108 176" fill="none" stroke="#334155" stroke-width="1.75"/>
  <text x="78" y="206" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">运维人员</text>

  <rect x="210" y="28" width="680" height="400" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.25" stroke-dasharray="7 5"/>
  <text x="232" y="56" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">中央节点</text>
  <text x="318" y="56" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">全局只部署一份</text>

  <rect x="232" y="80" width="280" height="108" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.25"/>
  <text x="372" y="118" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">控制台</text>
  <text x="372" y="144" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">总览 · 预警 · 权限 · 任务 · 日志</text>
  <text x="372" y="166" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">由中央服务托管</text>

  <rect x="560" y="80" width="300" height="150" rx="6" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="710" y="114" text-anchor="middle" fill="#1d4ed8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="15" font-weight="600">中央服务</text>
  <text x="710" y="140" text-anchor="middle" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">上报接入 · 权限 · 观测</text>
  <text x="710" y="162" text-anchor="middle" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">预警 · 任务 · 远程操作</text>
  <text x="710" y="188" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">监听 8080</text>

  <line x1="512" y1="134" x2="552" y2="134" stroke="#334155" stroke-width="1.5" marker-end="url(#sys-a)"/>
  <text x="532" y="124" text-anchor="middle" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">管理</text>

  <ellipse cx="372" cy="268" rx="78" ry="16" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.25"/>
  <path d="M294 268 V338 A78 16 0 0 0 450 338 V268" fill="#f5f3ff" stroke="#5b21b6" stroke-width="1.25"/>
  <ellipse cx="372" cy="268" rx="78" ry="16" fill="#ede9fe" stroke="#5b21b6" stroke-width="1.25"/>
  <text x="372" y="312" text-anchor="middle" fill="#5b21b6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="600">数据库</text>
  <text x="372" y="356" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">SQLite 或 MySQL</text>

  <line x1="560" y1="210" x2="450" y2="300" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#sys-a)"/>
  <text x="520" y="246" fill="#5b21b6" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">读写</text>

  <rect x="210" y="500" width="680" height="172" rx="10" fill="#f8fafc" stroke="#0f766e" stroke-width="1.25" stroke-dasharray="7 5"/>
  <text x="232" y="528" fill="#0f766e" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">被监控主机</text>
  <text x="338" y="528" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13">可部署多台，每台按需安装</text>
  <rect x="232" y="552" width="200" height="96" rx="6" fill="#ffffff" stroke="#0f766e" stroke-width="1.25"/>
  <text x="332" y="588" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">主机代理</text>
  <text x="332" y="612" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">CPU · 内存 · 磁盘 · 进程</text>
  <rect x="450" y="552" width="200" height="96" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.25"/>
  <text x="550" y="588" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">应用代理</text>
  <text x="550" y="612" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">进程运行状况</text>
  <rect x="668" y="552" width="200" height="96" rx="6" fill="#ffffff" stroke="#334155" stroke-width="1.25"/>
  <text x="768" y="588" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">Java 代理</text>
  <text x="768" y="612" text-anchor="middle" fill="#64748b" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">挂在 Java 进程内</text>

  <line x1="550" y1="500" x2="550" y2="428" stroke="#1d4ed8" stroke-width="1.5" marker-end="url(#sys-b)"/>
  <text x="562" y="470" fill="#1d4ed8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">指标上报 · 命令 · 终端</text>

  <rect x="930" y="80" width="234" height="250" rx="10" fill="#ffffff" stroke="#be123c" stroke-width="1.25" stroke-dasharray="7 5"/>
  <text x="952" y="112" fill="#be123c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">外部通知</text>
  <text x="1047" y="168" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">邮件</text>
  <text x="1047" y="200" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">企业微信</text>
  <text x="1047" y="232" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">钉钉 · 飞书</text>
  <text x="1047" y="264" text-anchor="middle" fill="#0f172a" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14">Webhook</text>
  <text x="1047" y="300" text-anchor="middle" fill="#94a3b8" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">中央服务主动送出</text>

  <line x1="860" y1="150" x2="922" y2="180" stroke="#be123c" stroke-width="1.5" marker-end="url(#sys-a)"/>
  <text x="868" y="142" fill="#be123c" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">预警</text>

  <line x1="124" y1="150" x2="224" y2="120" stroke="#334155" stroke-width="1.5" marker-end="url(#sys-a)"/>
  <text x="150" y="128" fill="#334155" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="12">浏览器</text>
</svg>